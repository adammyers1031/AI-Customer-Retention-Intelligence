services:
  api:
    build:
      context: .
      target: runtime
    image: customer-intelligence:local
    ports:
      - "8000:8000"
    environment:
      CI_DB_PATH: /data/retention.db
      CI_AUTO_SEED: "1"
      CI_LLM_PROVIDER: deterministic
      # To use a live OpenAI-compatible model instead:
      # CI_LLM_PROVIDER: openai
      # CI_LLM_API_KEY: ${CI_LLM_API_KEY}
      # CI_LLM_MODEL: gpt-4o-mini
    volumes:
      - retention-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  retention-data:
