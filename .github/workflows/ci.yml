name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      - name: Pipeline smoke test
        run: |
          customer-intel seed --reset
          customer-intel report --limit 5

  docker:
    name: Docker image and health check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t customer-intelligence:ci .

      - name: Run container
        run: docker run -d --name ci-api -p 8000:8000 customer-intelligence:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Service is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time."
          docker logs ci-api
          exit 1

      - name: Container logs
        if: always()
        run: docker logs ci-api || true

      - name: Stop container
        if: always()
        run: docker rm -f ci-api || true
